workflows:
  ios-app-store:
    name: Café Ciseaux — iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "be.cafeciseaux.app"
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps
      - name: Compiler l'application Angular (production)
        script: |
          npx ng build --configuration production
      - name: Synchroniser Capacitor iOS et CocoaPods
        script: |
          node scripts/patch-ios-pods.mjs
          rm -f ios/App/Podfile.lock
          npx cap sync ios
          cd ios/App && pod install --repo-update
      - name: Mettre à jour le numéro de build iOS
        script: |
          BUILD_NUM="${PROJECT_BUILD_NUMBER:-1}"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUM};/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Créer/récupérer le certificat et profil App Store Apple
        script: |
          set -e
          python3 - <<'EOF'
          import base64, os, re, sys, textwrap
          raw = os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY", "").replace("\\n", "\n").replace("\r", "").strip()
          if not raw:
              sys.exit("Erreur : APP_STORE_CONNECT_PRIVATE_KEY est vide.")
          if "BEGIN PRIVATE KEY" not in raw:
              try:
                  decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
                  if "BEGIN PRIVATE KEY" in decoded:
                      raw = decoded
              except Exception:
                  pass
          body = re.sub(r"-----BEGIN [^-]+-----|-----END [^-]+-----|\s+", "", raw)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              sys.exit("Erreur : APP_STORE_CONNECT_PRIVATE_KEY ne contient pas le texte du fichier .p8 (ouvrez le .p8 dans Bloc-notes et collez tout son contenu).")
          if len(der) < 60:
              sys.exit("Erreur : la clé .p8 semble incomplète (trop courte).")
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          with open("/tmp/asc_key.p8", "w") as f:
              f.write(pem)
          print("Clé privée .p8 normalisée avec succès.")
          EOF
          keychain initialize
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key -q -N ""
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@file:/tmp/asc_key.p8 \
            --certificate-key=@file:/tmp/cert_key
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj
      - name: Archiver et exporter l'IPA signé
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
          echo "=== Vérification des PrivacyInfo.xcprivacy embarqués ==="
          find build/ios/xcarchive -name "PrivacyInfo.xcprivacy" -print || true
      - name: Envoyer l'IPA sur App Store Connect / TestFlight
        script: |
          set -e
          IPA_FILE=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          app-store-connect publish \
            --path "$IPA_FILE" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key=@file:/tmp/asc_key.p8
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-play-store:
    name: Café Ciseaux — Android Play Store
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - cafe_ciseaux_keystore
      node: 20
      java: 17
    scripts:
      - name: Installer les dépendances npm
        script: |
          npm install --legacy-peer-deps
      - name: Compiler l'application Angular (production)
        script: |
          npx ng build --configuration production
      - name: Synchroniser Capacitor Android
        script: |
          npx cap sync android
      - name: Mettre à jour le versionCode Android
        script: |
          BUILD_NUM="${PROJECT_BUILD_NUMBER:-1}"
          sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUM}/" android/app/build.gradle
      - name: Générer l'Android App Bundle signé (.aab)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
