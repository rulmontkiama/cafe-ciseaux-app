<header>
  <div id="headerCenter">
    <div id="logo_side_left" class="logo_side_left">
      <a routerLink="cafeCiseaux" routerLinkActive="active" aria-label="Accueil Café Ciseaux">
        <img class="logo" src="assets/LOGO_CC_WHITE.svg" alt="Café Ciseaux">
      </a>
    </div>
    <div id="user_side_center" class="user_side_center">
      <div *ngIf="isUserLoggedIn" id="user_block" class="user_block">
        <div id="user_block_right" class="user_block_right">
          <a class="header-chip" [routerLink]="isAdmin() ? ['/admin/admin-message'] : ['/user-message']" routerLinkActive="is-active" [class.has-unread]="msgCount > 0" title="Messages">
            <img src="assets/MSG.svg" alt="Messages">
            <span>{{ msgCount }}</span>
          </a>
          <a *ngIf="isAdmin()" class="header-admin-pill" [routerLink]="['admin']" routerLinkActive="is-active" title="Espace administration">
            <img src="assets/PARAM_WHEEL.svg" alt="">
            <span>ADMIN</span>
          </a>
        </div>

        <a id="user_frame" class="user_frame" [routerLink]="['profile']" routerLinkActive="is-active" title="Mon profil">
          <img [src]="avatar || 'assets/AVATAR.svg'" alt="Mon profil" />
        </a>
      </div>

      <a *ngIf="!isUserLoggedIn" [routerLink]="['login']" routerLinkActive="active" class="login-cta">
        <span>CONNEXION</span>
        <img src="assets/LOGIN.svg" alt="">
      </a>
    </div>
  </div>
</header>
