<div class="manager-wrap">
  <div class="admin-section-header">
    <span class="cut_angle">
      <h2>TOUS LES RDV.</h2>
    </span>
    <p>Recherchez par nom ou triez par date.</p>
  </div>

  <div class="search-container">
    <input
      type="text"
      placeholder="Rechercher un client…"
      [value]="searchTerm"
      (input)="search($event)" />
    <button type="button" class="sort-btn" (click)="toggleOrder()" title="Inverser l'ordre chronologique">
      <span>{{ orderDirection === 'desc' ? 'Plus récents ↓' : 'Plus anciens ↑' }}</span>
    </button>
  </div>

  <p *ngIf="!loading && rendezVous.length === 0" class="manager-state">
    Aucun rendez-vous trouvé.
  </p>

  <ul *ngIf="rendezVous.length > 0" class="RDV_list">
    <li
      *ngFor="let rdv of rendezVous"
      class="rdvUnit"
      [attr.id]="'rdv-' + rdv.id"
      [class.has-passed]="rdv.passed">
      <div class="rdv-date-col">
        <span class="rdv-hour">{{ rdv.hours }}</span>
        <span class="rdv-date">{{ rdv.dateString }}</span>
      </div>

      <div class="RDV_avatar">
        <img loading="lazy" decoding="async" [src]="rdv.avatar || 'assets/AVATAR.svg'" alt="Avatar client">
      </div>

      <div class="rdv_infos_container">
        <strong class="rdv-client">{{ rdv.prenom | uppercase }} {{ rdv.nom | uppercase }}</strong>
        <span class="rdv-meta">{{ rdv.type | uppercase }}</span>
        <a *ngIf="rdv.phone" class="rdv-phone" [href]="'tel:' + rdv.phone">📞 {{ rdv.phone }}</a>
      </div>

      <div class="rdv-actions-col">
        <span *ngIf="rdv.passed" class="status-passed">Passé</span>
        <button
          *ngIf="!rdv.passed"
          type="button"
          class="delete-rdv-btn"
          [disabled]="isDeleteDisabled"
          (click)="removeRDV($event, rdv.id)">
          Supprimer
        </button>
      </div>
    </li>
  </ul>

  <p *ngIf="loading" class="manager-state">Chargement…</p>
</div>
