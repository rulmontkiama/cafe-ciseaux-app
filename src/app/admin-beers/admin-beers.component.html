<div class="admin-beers-wrap">
  <div class="admin-section-header">
    <span class="cut_angle">
      <h2>CARTE DES BIÈRES.</h2>
    </span>
    <p>Ajoutez ou retirez les bières proposées au bar.</p>
  </div>

  <section class="beer-form-card">
    <h3>AJOUTER UNE BIÈRE</h3>

    <div class="field-group">
      <label for="beerName">NOM</label>
      <input type="text" placeholder="Ex. Peak Triple" id="beerName" [(ngModel)]="beerName">
    </div>

    <div class="field-group">
      <label for="beerDescription">DESCRIPTION</label>
      <textarea id="beerDescription" rows="3" placeholder="Notes de dégustation, degré d'alcool…" [(ngModel)]="beerDescription"></textarea>
    </div>

    <div class="field-group" *ngIf="!useStorage">
      <label for="beerImageUrl">URL DE L'IMAGE (OPTIONNEL)</label>
      <input type="text" placeholder="https://… (sinon image par défaut)" id="beerImageUrl" [(ngModel)]="imageUrl">
    </div>

    <div class="custom-file-input" *ngIf="useStorage">
      <button type="button" class="file-btn" (click)="fileInput.click()">
        {{ selectedFile ? selectedFile.name : 'Choisir une image' }}
      </button>
      <input type="file" #fileInput style="display: none;" accept="image/*" (change)="onFileSelected($event)">
    </div>

    <button class="uploadBeer" type="button" [disabled]="isSaving" (click)="uploadBeer()">
      {{ isSaving ? 'ENREGISTREMENT…' : 'AJOUTER À LA CARTE' }}
    </button>
  </section>

  <section class="beers_container">
    <div class="list-header">
      <h3>BIÈRES EN CARTE ({{ allBeers.length }})</h3>
    </div>

    <p *ngIf="isLoading" class="beers-state">Chargement de la carte…</p>
    <p *ngIf="!isLoading && allBeers.length === 0" class="beers-state">Aucune bière dans la carte pour le moment.</p>

    <ul *ngIf="!isLoading && allBeers.length > 0" class="beers_list">
      <li *ngFor="let beer of allBeers" class="beerUnit">
        <div class="beerImageContainer">
          <img loading="lazy" decoding="async" [src]="beer.imageUrl || 'assets/BIERES.jpg'" [alt]="beer.nom || 'Bière'">
        </div>
        <div class="beer-body">
          <div class="beer-top-row">
            <span class="cut_angle">
              <h2>{{ beer.nom | uppercase }}</h2>
            </span>
            <button type="button" class="removebeer" (click)="confirmAndRemoveBeer(beer.id)" aria-label="Supprimer cette bière">
              Supprimer
            </button>
          </div>
          <p>{{ beer.description }}</p>
        </div>
      </li>
    </ul>
  </section>
</div>
