<div>
  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="reset-form">
    <span class="cut_angle">
      <h2>MOT DE PASSE OUBLIÉ.</h2>
    </span>
    <p>
      Entrez l'adresse e-mail associée à votre compte. Nous vous enverrons un lien pour réinitialiser votre mot de passe.
    </p>
    <div class="form-group">
      <span class="form_error">
        <span *ngIf="submitted && email?.errors?.['required']">
          <p>Veuillez entrer un e-mail</p>
        </span>
        <span *ngIf="email?.touched && email?.errors?.['invalidEmail']">
          <p>Veuillez entrer un e-mail valide</p>
        </span>
      </span>
      <div class="block_cyber">
        <label for="email">E-MAIL</label>
        <input class="input_cyber" type="email" formControlName="email" id="email" placeholder="votre@email.com" autocomplete="email" required>
      </div>
    </div>
    <button type="submit" [disabled]="resetPasswordForm.invalid || sending" class="btn btn-primary">
      {{ sending ? 'ENVOI…' : 'ENVOYER LE LIEN' }}
    </button>
    <div class="forget_password" [routerLink]="['/login']">
      <p>← Retour à la connexion</p>
    </div>
  </form>
</div>
