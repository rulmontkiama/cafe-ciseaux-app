<div>
    <form [formGroup]="resetPasswordForm" (ngSubmit) = "onSubmit()" class="reset-form" >
        <span class="cut_angle">
            <h2>RESET PASSWORD</h2>
        </span>
        <p>
            Entrez ci-dessous l'adresse e-mail qui vous sert d'identifiant,
            et validez. Nous allons vous envoyer un lien qui vous permettra de réinitialiser votre mot de passe.
        </p>
    <div class="form-group">
        <span class="form_error">
            <span *ngIf="submitted && resetPasswordForm.controls.email.errors?.['required'] ">
                <p>
                    Veuillez entrer un E-mail
                </p>  
            </span>
            <span *ngIf="resetPasswordForm.controls.email.touched  && resetPasswordForm.controls.email.errors?.['invalidEmail']" >
                <p>
                    Veuillez entrer un E-mail valide
                </p>  
            </span>             
        </span>
        <div class="block_cyber">
            <label for="email">EMAIL :</label>
            <input class="input_cyber" type="email" formControlName="email" id="email" required>
        </div>
    </div>
    <button type="submit" [disabled]="resetPasswordForm.invalid" class="btn btn-primary">RESET EMAIL</button>
  </form>
</div>
