<div class="admin-users-wrap">
  <div class="admin-section-header">
    <span class="cut_angle">
      <h2>CLIENTS.</h2>
    </span>
    <p>Annuaire clients, coordonnées et nombre de visites.</p>
  </div>

  <div class="search-container">
    <input
      type="text"
      placeholder="Rechercher par nom, prénom, e-mail ou téléphone…"
      [value]="searchTerm"
      (input)="search($event)" />
  </div>

  <p *ngIf="!loading && users.length === 0" class="users-state">Aucun client trouvé.</p>

  <ul *ngIf="users.length > 0" class="adminList">
    <li *ngFor="let user of users" class="user-card">
      <div class="user-card-top">
        <div class="avatar">
          <img loading="lazy" decoding="async" [src]="user.avatar || 'assets/AVATAR.svg'" alt="Avatar client" class="avatar-image" />
        </div>
        <div class="user-info">
          <h2>{{ user.prenom | uppercase }} {{ user.nom | uppercase }}</h2>
          <p class="user-email">{{ user.email }}</p>
          <a *ngIf="user.phone" class="user-phone" [href]="'tel:' + user.phone">
            T. {{ user.phone }}
          </a>
        </div>
      </div>

      <div class="user-card-actions">
        <span class="user-badge" *ngIf="user.rdvCount !== undefined">{{ user.rdvCount }} RDV</span>

        <div class="right-actions">
          <button
            type="button"
            class="msg-action-btn"
            (click)="openMessage(user)"
            title="Envoyer un message à ce client">
            MESSAGE →
          </button>
        </div>
      </div>
    </li>
  </ul>

  <div *ngIf="loading" class="users-state">Chargement…</div>
</div>
